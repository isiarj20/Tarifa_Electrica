name: Update PVPC prices

on:
  schedule:
    - cron: "0 7 * * *"
    - cron: "0 13 * * *"
    - cron: "35 18 * * *"
    - cron: "15 19 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar precios
        run: python fetch_prices.py

      - name: Avisar por Telegram si hay horas a 0€ o negativas
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify_negative.py

      - name: Publicar cambios
        run: |
          git config user.name "pvpc-bot"
          git config user.email "pvpc-bot@users.noreply.github.com"
          git add -A docs
          git diff --cached --quiet || git commit -m "Actualiza precios PVPC"
          git push
