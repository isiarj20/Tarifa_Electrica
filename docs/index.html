<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Precio luz</title>
<style>
  :root{
    --bg: #14161b;
    --bg-card: #1b1e25;
    --line: #2a2e37;
    --text: #eceff2;
    --text-dim: #8b909c;
    --amber: #f0b429;
    --amber-dim: #7a5d1e;
    --red: #e35d5d;
    --neon: #39ff88;
    --good: #4ade80;
    --mid: #facc15;
    --bad: #f87171;
    --mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace;
    --sans: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--text); font-family:var(--sans); }
  body{
    min-height:100vh;
    padding: max(20px, env(safe-area-inset-top)) 18px max(20px, env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:16px;
  }
  header{ display:flex; flex-direction:column; gap:4px; padding: 4px 2px 8px; }
  .eyebrow{ font-size:13px; color:var(--text-dim); letter-spacing:.02em; }
  .now-price{ font-family:var(--mono); font-size:40px; font-weight:600; line-height:1.1; color:var(--amber); }
  .now-price small{ font-size:16px; color:var(--text-dim); font-weight:500; margin-left:6px; }
  .updated{ font-size:12px; color:var(--text-dim); }

  .status{
    font-size:13px; color:var(--text-dim); background:var(--bg-card);
    border:1px solid var(--line); border-radius:10px; padding:10px 12px;
  }
  .status.warn{ color:#f0d29a; border-color:var(--amber-dim); }

  .curve{ display:flex; align-items:flex-end; gap:2px; height:44px; margin-top:6px; }
  .curve i{ flex:1; background:var(--line); border-radius:2px 2px 0 0; display:block; }
  .curve i.now{ background:var(--amber); }
  .curve i.neon{ background:var(--neon); box-shadow:0 0 8px var(--neon); }
  .curve i.now.neon{ background:var(--neon); box-shadow:0 0 12px 2px var(--neon); }

  @keyframes neon-pulse{
    0%,100%{ box-shadow:0 0 6px 1px var(--neon); }
    50%{ box-shadow:0 0 16px 4px var(--neon); }
  }
  .now-price.neon{ color:var(--neon); text-shadow:0 0 10px var(--neon); animation:neon-pulse 1.6s ease-in-out infinite; }
  .card.neon-alert{ border-color:var(--neon); box-shadow:0 0 14px -2px var(--neon); }
  .card.neon-alert .window{ color:var(--neon); text-shadow:0 0 8px var(--neon); }
  .neon-badge{
    display:inline-block; font-family:var(--sans); font-size:11px; font-weight:800; letter-spacing:.03em;
    color:#06240f; background:var(--neon); border-radius:5px; padding:2px 6px; margin-left:8px; vertical-align:2px;
    animation:neon-pulse 1.6s ease-in-out infinite;
  }
  .free-banner{
    font-family:var(--sans); font-size:15px; font-weight:700; color:#06240f;
    background:var(--neon); border-radius:10px; padding:12px 14px;
    animation:neon-pulse 1.6s ease-in-out infinite; margin:0;
  }
  .free-banner .sub{ display:block; font-size:12px; font-weight:600; opacity:.75; margin-top:2px; }

  section.cards{ display:flex; flex-direction:column; gap:10px; }
  .card{
    background:var(--bg-card); border:1px solid var(--line); border-radius:14px;
    padding:16px 16px 14px; display:flex; flex-direction:column; gap:6px;
  }
  .card .label{ font-size:13px; color:var(--text-dim); }
  .card .window{ font-family:var(--mono); font-size:26px; font-weight:600; letter-spacing:-.01em; }
  .card .window .day-tag{
    font-family:var(--sans); font-size:11px; font-weight:700; letter-spacing:.03em;
    color:var(--bg); background:var(--amber); border-radius:5px; padding:2px 6px; margin-right:8px; vertical-align:2px;
  }
  .card .meta{ font-size:12px; color:var(--text-dim); font-family:var(--mono); }
  .card.tomorrow-better{ border-color:var(--amber-dim); }
  .hint{ font-size:12px; color:var(--amber); }
  .card .second{
    margin-top:6px; padding-top:8px; border-top:1px dashed var(--line);
    font-size:13px; color:var(--text-dim);
  }
  .card .second b{ font-family:var(--mono); color:var(--text); font-weight:600; }
  .card .second .pct{ color:var(--amber); }

  .daychart{ margin-top:12px; }
  .daychart-head{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:2px; }
  .daychart-cap{ font-size:12px; color:var(--text-dim); }
  .legend{ display:flex; gap:10px; font-size:11px; color:var(--text-dim); }
  .legend span{ display:inline-flex; align-items:center; gap:4px; }
  .legend i{ width:8px; height:8px; border-radius:50%; display:inline-block; }
  .daychart svg{ display:block; width:100%; height:auto; }

  footer{ margin-top:auto; padding-top:8px; font-size:11px; color:var(--text-dim); text-align:center; }
  .error{ color:var(--red); font-size:14px; padding:20px 4px; }
</style>
</head>
<body>

  <header>
    <div class="eyebrow">Precio de la luz · PVPC 2.0TD</div>
    <div class="now-price" id="nowPrice">— <small>€/kWh ahora</small></div>
    <div class="curve" id="curve"></div>
    <div class="daychart" id="dayChart"></div>
    <div class="updated" id="updated"></div>
  </header>

  <div id="freeBanner"></div>

  <div class="status" id="tomorrowStatus"></div>

  <section class="cards" id="cards">
    <div class="label" style="padding:10px 2px;color:var(--text-dim);">Cargando…</div>
  </section>

  <footer>Datos: Red Eléctrica de España (REE) · se actualiza varias veces al día</footer>

<script>
const APPLIANCES = [
  { key: 'lavaplatos', name: 'Lavaplatos', hours: 4 },
  { key: 'lavadora',   name: 'Lavadora / Secadora (delicados)', hours: 1 },
  { key: 'secadora',   name: 'Secadora (normal, 2h30)', hours: 3 },
];

// Agrupa una lista de horas (0-23) con precio <=0 en rangos contiguos,
// p.ej. [14,15,16] -> "14:00 y las 17:00" (de 14h a 17h, fin exclusivo).
function freeHourRanges(prices){
  const freeHours = (prices || [])
    .filter(p => p.price <= 0)
    .map(p => p.hour)
    .sort((a, b) => a - b);
  if (freeHours.length === 0) return [];

  const ranges = [];
  let rangeStart = freeHours[0];
  let prev = freeHours[0];
  for (let i = 1; i < freeHours.length; i++){
    const h = freeHours[i];
    if (h === prev + 1){
      prev = h;
      continue;
    }
    ranges.push([rangeStart, prev + 1]);
    rangeStart = h;
    prev = h;
  }
  ranges.push([rangeStart, prev + 1]);
  return ranges;
}

function formatFreeRanges(ranges){
  return ranges
    .map(([start, end]) => `${String(start).padStart(2,'0')}:00 y las ${String(end).padStart(2,'0')}:00`)
    .join(', y entre las ');
}

function fmtHour(h){
  const day = Math.floor(h/24);
  const hh = h % 24;
  return { label: `${String(hh).padStart(2,'0')}:00`, day };
}

// Mejor ventana contigua de N horas. Si se pasa `accept`, solo se consideran las ventanas
// cuya hora de inicio (startAbs) cumple esa condición.
function bestWindow(timeline, hours, accept){
  if (timeline.length < hours) return null;
  let best = null;
  for (let start = 0; start <= timeline.length - hours; start++){
    const startAbs = timeline[start].abs;
    const endAbs = startAbs + hours;
    if (accept && !accept(startAbs)) continue;
    const slice = timeline.slice(start, start + hours);
    const avg = slice.reduce((s,p)=>s+p.price,0) / hours;
    if (!best || avg < best.avg) best = { startIdx: start, avg };
  }
  if (!best) return null;
  const startAbs = timeline[best.startIdx].abs;
  const endAbs = startAbs + hours;
  return { startAbs, endAbs, avg: best.avg };
}

const TIER_COLORS = { good:'#4ade80', mid:'#facc15', bad:'#f87171' };

// Reparte las horas del día en tres tercios por orden de precio:
// el tercio más barato (verde), el intermedio (amarillo) y el más caro (rojo).
function priceTiers(prices){
  const n = prices.length;
  const order = prices.map((p, i) => ({ i, price: p.price }))
                      .sort((a, b) => a.price - b.price || a.i - b.i);
  const tiers = new Array(n);
  order.forEach((o, rank) => {
    tiers[o.i] = rank < n / 3 ? 'good' : (rank < 2 * n / 3 ? 'mid' : 'bad');
  });
  return tiers;
}

// Línea continua con el precio de todo el día (00h-24h), coloreada por tramos de precio.
function renderDayChart(prices, now){
  const el = document.getElementById('dayChart');
  if (!prices || prices.length < 2){ el.innerHTML = ''; return; }

  const W = 340, H = 134, L = 42, R = 8, T = 14, B = 22;
  const pw = W - L - R, ph = H - T - B, n = prices.length;
  const vals = prices.map(p => p.price);
  const hi = Math.max(...vals), lo = Math.min(...vals);
  const range = (hi - lo) || 1;
  const yTop = T + 4, yBot = T + ph - 4, base = T + ph;
  const x = i => L + (i + 0.5) / n * pw;
  const y = v => yTop + (1 - (v - lo) / range) * (yBot - yTop);
  const tiers = priceTiers(prices);

  // Degradado con cortes secos en la frontera de cada hora: cada hora lleva su color.
  let stops = '';
  tiers.forEach((t, i) => {
    const a = (i / n).toFixed(4), b = ((i + 1) / n).toFixed(4);
    stops += `<stop offset="${a}" stop-color="${TIER_COLORS[t]}"/><stop offset="${b}" stop-color="${TIER_COLORS[t]}"/>`;
  });

  const pts = prices.map((p, i) => `${x(i).toFixed(1)},${y(p.price).toFixed(1)}`);
  const linePts = pts.join(' ');
  const areaPath = `M${x(0).toFixed(1)},${base} L${pts.join(' L')} L${x(n - 1).toFixed(1)},${base} Z`;

  // Marcas del eje horizontal: 00, 06, 12, 18, 24
  let grid = '';
  [0, 6, 12, 18, 24].forEach(h => {
    const gx = (L + h / 24 * pw).toFixed(1);
    grid += `<line x1="${gx}" y1="${T}" x2="${gx}" y2="${base}" stroke="#2a2e37" stroke-width="1"/>`;
    grid += `<text x="${gx}" y="${H - 6}" text-anchor="middle" fill="#8b909c" font-size="10" font-family="monospace">${String(h).padStart(2, '0')}</text>`;
  });

  // Etiquetas del eje vertical: precio máximo y mínimo del día (y línea del cero si hay precios negativos)
  let yAxis =
    `<text x="${L - 5}" y="${(y(hi) + 3).toFixed(1)}" text-anchor="end" fill="#8b909c" font-size="10" font-family="monospace">${hi.toFixed(3)}</text>` +
    `<text x="${L - 5}" y="${(y(lo) + 3).toFixed(1)}" text-anchor="end" fill="#8b909c" font-size="10" font-family="monospace">${lo.toFixed(3)}</text>`;
  if (lo < 0 && hi > 0){
    yAxis += `<line x1="${L}" y1="${y(0).toFixed(1)}" x2="${W - R}" y2="${y(0).toFixed(1)}" stroke="#8b909c" stroke-width="1" stroke-dasharray="3 3"/>` +
             (Math.abs(y(0) - y(lo)) >= 12   // si el 0 queda pegado al mínimo, no se pinta su etiqueta para que no se pisen
               ? `<text x="${L - 5}" y="${(y(0) + 3).toFixed(1)}" text-anchor="end" fill="#8b909c" font-size="10" font-family="monospace">0</text>`
               : '');
  }

  // Ahora: horas pasadas atenuadas, línea vertical y punto sobre la curva
  const hNow = now.getHours();
  const xNow = L + (hNow + now.getMinutes() / 60) / 24 * pw;
  const nowIdx = Math.min(hNow, n - 1);
  const nowMark =
    `<rect x="${L}" y="${T}" width="${Math.max(0, xNow - L).toFixed(1)}" height="${ph}" fill="#14161b" fill-opacity="0.55"/>` +
    `<line x1="${xNow.toFixed(1)}" y1="${T - 2}" x2="${xNow.toFixed(1)}" y2="${base}" stroke="#f0b429" stroke-width="1" stroke-dasharray="3 2"/>` +
    `<circle cx="${x(nowIdx).toFixed(1)}" cy="${y(prices[nowIdx].price).toFixed(1)}" r="3.8" fill="#ffffff" stroke="#14161b" stroke-width="1.5"/>` +
    `<text x="${xNow.toFixed(1)}" y="${T - 4}" text-anchor="${xNow > W - 36 ? 'end' : 'middle'}" fill="#f0b429" font-size="9" font-family="monospace">ahora</text>`;

  el.innerHTML = `
    <div class="daychart-head">
      <div class="daychart-cap">Hoy, hora a hora (€/kWh)</div>
      <div class="legend">
        <span><i style="background:${TIER_COLORS.good}"></i>barata</span>
        <span><i style="background:${TIER_COLORS.mid}"></i>media</span>
        <span><i style="background:${TIER_COLORS.bad}"></i>cara</span>
      </div>
    </div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Precio de la luz hora a hora durante todo el día">
      <defs>
        <linearGradient id="dayGrad" gradientUnits="userSpaceOnUse" x1="${L}" y1="0" x2="${W - R}" y2="0">${stops}</linearGradient>
      </defs>
      ${grid}
      <path d="${areaPath}" fill="url(#dayGrad)" fill-opacity="0.14"/>
      ${yAxis}
      <polyline points="${linePts}" fill="none" stroke="url(#dayGrad)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
      ${nowMark}
    </svg>`;
}

function renderCurve(timeline, nowAbs){
  const el = document.getElementById('curve');
  el.innerHTML = '';
  const todayOnly = timeline.filter(p => p.abs < 24);
  if (todayOnly.length === 0) return;
  const max = Math.max(...timeline.map(p=>p.price));
  const min = Math.min(...timeline.map(p=>p.price));
  const range = (max - min) || 1;
  for (const p of todayOnly){
    const bar = document.createElement('i');
    const h = 8 + ((p.price - min) / range) * 36;
    bar.style.height = h + 'px';
    const classes = [];
    if (p.abs === nowAbs) classes.push('now');
    if (p.price <= 0) classes.push('neon');
    bar.className = classes.join(' ');
    el.appendChild(bar);
  }
}

const LOOKAHEAD_HOURS = 12;
const SECOND_MIN_GAP_H = 2;   // la 2ª opción empieza al menos 2 h antes (o después) que la 1ª

let lastData = null;   // última carga correcta, por si falla la red al volver a la app

async function load(){
  let data;
  let offline = false;
  const statusEl = document.getElementById('tomorrowStatus');
  try{
    const res = await fetch('prices.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    data = await res.json();
    lastData = data;
  }catch(e){
    if (lastData){
      // Sin red: se repinta lo último cargado (la guarda de fechas sigue protegiendo de datos viejos).
      data = lastData;
      offline = true;
    } else {
      statusEl.style.display = 'none';
      document.getElementById('cards').innerHTML = '<div class="error">No se han podido cargar los precios (prices.json). Comprueba que el workflow de GitHub Actions se ha ejecutado.</div>';
      return;
    }
  }

  // Cada repintado parte del aviso en su estado inicial (si no, se queda oculto o en ámbar de una carga anterior).
  statusEl.className = 'status';
  statusEl.style.display = '';

  const now = new Date();
  const nowHour = now.getHours();
  const cutoffAbs = nowHour + LOOKAHEAD_HOURS;

  // --- Guarda anti datos viejos ---
  // Se casa cada bloque de precios con su fecha real y se compara con la fecha de hoy
  // en el móvil. Así, si el JSON es de hace días, no se usa como si fuera de hoy.
  const pad2 = n => String(n).padStart(2, '0');
  const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  const todayStr = ymd(now);
  const tomorrowStr = ymd(new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1));

  const byDate = {};
  for (const key of ['today', 'tomorrow']){
    const d = data[key];
    if (d && d.date && d.prices) byDate[d.date] = d.prices;
  }

  if (!byDate[todayStr]){
    const known = Object.keys(byDate).sort();
    const latest = known.length ? known[known.length - 1] : null;
    const latestEs = latest ? latest.split('-').reverse().join('/') : 'ninguna fecha';
    document.getElementById('nowPrice').innerHTML = '— <small>€/kWh ahora</small>';
    document.getElementById('updated').textContent =
      'Última actualización: ' + new Date(data.generated_at).toLocaleString('es-ES');
    statusEl.style.display = 'none';
    document.getElementById('curve').innerHTML = '';
    document.getElementById('dayChart').innerHTML = '';
    document.getElementById('freeBanner').innerHTML = '';
    document.getElementById('cards').innerHTML =
      `<div class="error"><b>⚠ Datos desactualizados.</b><br>Los precios guardados son del ${latestEs}, no de hoy (${todayStr.split('-').reverse().join('/')}). `
      + `No te fíes de esta página hasta que se actualice.<br><br>`
      + `Comprueba que el workflow de GitHub Actions se ha ejecutado y que GitHub Pages sirve la misma carpeta donde se guarda prices.json.</div>`;
    return;
  }

  // A partir de aquí, "hoy" y "mañana" son los de verdad (aunque el JSON se generara ayer por la noche).
  data = {
    generated_at: data.generated_at,
    today: { date: todayStr, prices: byDate[todayStr] },
    tomorrow: { date: tomorrowStr, prices: byDate[tomorrowStr] || null }
  };

  const timeline = [];
  if (data.today && data.today.prices){
    for (const p of data.today.prices){
      if (p.hour >= nowHour && p.hour < cutoffAbs) timeline.push({ abs: p.hour, price: p.price });
    }
  }
  const tomorrowAvailable = !!(data.tomorrow && data.tomorrow.prices);
  if (tomorrowAvailable){
    for (const p of data.tomorrow.prices){
      const abs = p.hour + 24;
      if (abs < cutoffAbs) timeline.push({ abs, price: p.price });
    }
  }

  const nowEntry = (data.today?.prices || []).find(p => p.hour === nowHour);
  document.getElementById('nowPrice').innerHTML =
    (nowEntry ? nowEntry.price.toFixed(3) : '—') + ' <small>€/kWh ahora</small>';
  document.getElementById('updated').textContent =
    'Actualizado: ' + new Date(data.generated_at).toLocaleString('es-ES') + ` · próximas ${LOOKAHEAD_HOURS}h` +
    (offline ? ' · ⚠ sin conexión: datos de la última carga' : '');

  renderCurve(timeline, nowHour);
  renderDayChart(data.today.prices, now);

  const freeBannerEl = document.getElementById('freeBanner');
  const todayFreeRanges = freeHourRanges(data.today?.prices);
  const tomorrowFreeRanges = tomorrowAvailable ? freeHourRanges(data.tomorrow.prices) : [];

  const todayHasNegative = todayFreeRanges.some(([s,e]) =>
    (data.today?.prices || []).some(p => p.hour >= s && p.hour < e && p.price < 0));

  let bannerHtml = '';
  if (todayFreeRanges.length){
    bannerHtml += `⚡ Hoy entre las ${formatFreeRanges(todayFreeRanges)} la luz será gratis${todayHasNegative ? ' (¡e incluso te pagan!)' : ''}`;
    if (tomorrowFreeRanges.length){
      bannerHtml += `<span class="sub">Mañana también, entre las ${formatFreeRanges(tomorrowFreeRanges)}</span>`;
    }
  } else if (tomorrowFreeRanges.length){
    bannerHtml += `⚡ Mañana entre las ${formatFreeRanges(tomorrowFreeRanges)} la luz será gratis`;
  }

  freeBannerEl.innerHTML = bannerHtml ? `<p class="free-banner">${bannerHtml}</p>` : '';

  const needsTomorrowData = cutoffAbs > 24;
  if (tomorrowAvailable){
    statusEl.textContent = `Precios de mañana (${data.tomorrow.date}) ya publicados — el cálculo cubre toda la ventana de las próximas ${LOOKAHEAD_HOURS}h.`;
  } else if (needsTomorrowData) {
    statusEl.className = 'status warn';
    statusEl.textContent = `Precios de mañana aún no publicados (suelen salir sobre las 20:30). Por ahora el cálculo solo cubre hasta la medianoche de hoy.`;
  } else {
    statusEl.textContent = `La ventana de las próximas ${LOOKAHEAD_HOURS}h cabe entera dentro de hoy.`;
  }

  const cardsEl = document.getElementById('cards');
  cardsEl.innerHTML = '';

  // Con precios de mañana sin publicar y la ventana metiéndose en el día siguiente,
  // el cálculo solo ve hasta medianoche: es provisional.
  const provisional = !tomorrowAvailable && needsTomorrowData;

  for (const app of APPLIANCES){
    const durationLabel = app.hours === 1 ? '1h' : `${app.hours}h seguidas`;

    // No esconder la tarjeta: explicar por qué todavía no se puede calcular.
    if (timeline.length < app.hours){
      const missing = document.createElement('div');
      missing.className = 'card';
      missing.innerHTML = `
        <div class="label">${app.name}</div>
        <div class="window" style="font-size:18px;color:var(--text-dim);">Aún sin calcular</div>
        <div class="hint" style="color:var(--text-dim);">${
          provisional
            ? `Faltan los precios de mañana para encontrar ${durationLabel} (salen sobre las 20:30). Vuelve a mirar entonces.`
            : `No hay ${durationLabel} con precio conocido en las próximas ${LOOKAHEAD_HOURS}h.`
        }</div>
      `;
      cardsEl.appendChild(missing);
      continue;
    }

    const overall = bestWindow(timeline, app.hours);
    if (!overall) continue;

    const rightNowSlice = timeline.slice(0, app.hours);
    const rightNowAvg = rightNowSlice.reduce((s,p)=>s+p.price,0) / app.hours;

    const start = fmtHour(overall.startAbs);
    const end = fmtHour(overall.endAbs);
    const startsNow = overall.startAbs === timeline[0].abs;

    // 2ª opción (plan B), separada en el tiempo de la 1ª para que sea una alternativa de verdad:
    // la más barata que empieza al menos SECOND_MIN_GAP_H horas ANTES que la 1ª (contando "ahora").
    // Si la 1ª ya es "ahora" (o no hay nada con esa antelación), la más barata al menos esas horas DESPUÉS.
    // "Ahora" siempre cuenta como plan B si la 1ª es más tarde, aunque falte menos de SECOND_MIN_GAP_H horas.
    const nowAbs = timeline[0].abs;
    let second = bestWindow(timeline, app.hours,
      st => st <= overall.startAbs - SECOND_MIN_GAP_H || (st === nowAbs && st < overall.startAbs));
    if (!second) second = bestWindow(timeline, app.hours, st => st >= overall.startAbs + SECOND_MIN_GAP_H);
    // % de ahorro frente a ponerlo ya (null si el precio de ahora es 0 o negativo: no tiene sentido el %)
    const pctVsNow = other => rightNowAvg > 0 ? Math.round((rightNowAvg - other) / rightNowAvg * 100) : null;
    const savingPct = pctVsNow(overall.avg);
    const worthWaiting = !startsNow && savingPct !== null && savingPct > 5;

    let secondHtml = '';
    if (second){
      const s2 = fmtHour(second.startAbs);
      const e2 = fmtHour(second.endAbs);
      const isNow2 = second.startAbs === timeline[0].abs;
      const when2 = isNow2
        ? 'ahora'
        : `${s2.label} – ${e2.label}${s2.day > 0 ? ' de mañana' : ''}`;
      const parts = [];
      if (!isNow2){
        const p2 = pctVsNow(second.avg);
        if (p2 !== null){
          parts.push(p2 > 0 ? `~${p2}% más barato que ponerlo ya`
                   : p2 < 0 ? `~${Math.abs(p2)}% más caro que ponerlo ya`
                   : 'igual que ponerlo ya');
        }
      }
      const diff = second.avg - overall.avg;
      parts.push(diff > 0.0005 ? `+${diff.toFixed(3)} €/kWh vs la 1ª` : 'igual que la 1ª');
      secondHtml = `<div class="second">2ª opción: <b>${when2}</b> · media ${second.avg.toFixed(3)} €/kWh · <span class="pct">${parts.join(' · ')}</span></div>`;
    }

    let hintHtml = '';
    if (worthWaiting){
      hintHtml = `<div class="hint">Esperar a ${start.label}${start.day>0?' de mañana':''} sale ~${savingPct}% más barato que ponerlo ya</div>`;
    } else if (startsNow){
      hintHtml = provisional
        ? '<div class="hint" style="color:var(--text-dim);">Con lo que se conoce hasta medianoche, ponlo ya. Puede cambiar cuando salgan los precios de mañana.</div>'
        : `<div class="hint" style="color:var(--text-dim);">Ya es la mejor opción dentro de las próximas ${LOOKAHEAD_HOURS}h — ponlo ya</div>`;
    }
    const provisionalHtml = (provisional && !startsNow)
      ? '<div class="hint" style="color:var(--text-dim);">Provisional: aún no hay precios de mañana.</div>'
      : '';

    const card = document.createElement('div');
    card.className = 'card' + (worthWaiting ? ' tomorrow-better' : '');
    card.innerHTML = `
      <div class="label">${app.name}</div>
      <div class="window">
        ${startsNow ? 'AHORA' : `${start.day > 0 ? '<span class="day-tag">MAÑANA</span>' : ''}${start.label} – ${end.label}`}
      </div>
      <div class="meta">media ${overall.avg.toFixed(3)} €/kWh${startsNow ? '' : ` · ahora mismo ${rightNowAvg.toFixed(3)} €/kWh`}</div>
      ${hintHtml}
      ${provisionalHtml}
      ${secondHtml}
    `;
    cardsEl.appendChild(card);
  }
}

// ---- Refresco de datos ----
// La webapp de la pantalla de inicio del iPhone a veces no recarga al volver a abrirla,
// así que se vuelve a pedir el JSON en cada señal de que la página está de nuevo a la vista.
let refreshing = false;

async function refreshPrices(){
  if (refreshing || document.visibilityState !== 'visible') return;
  refreshing = true;
  try {
    await load();
  } catch (e) {
    console.error(e);
  } finally {
    refreshing = false;
  }
}

refreshPrices();                                                   // carga inicial

document.addEventListener('visibilitychange', () => {              // al volver desde otra app
  if (document.visibilityState === 'visible') refreshPrices();
});
window.addEventListener('pageshow', () => refreshPrices());        // página restaurada o de la caché
window.addEventListener('focus', () => refreshPrices());           // algunas webapps de iOS no lanzan visibilitychange
window.addEventListener('online', () => refreshPrices());          // al recuperar la conexión
setInterval(refreshPrices, 5 * 60 * 1000);                         // con la página abierta, cada 5 minutos
</script>
